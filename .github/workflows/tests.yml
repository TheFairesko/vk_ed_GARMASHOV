name: Run Tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  # Базовые тесты с SQLite
  test-sqlite:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12"]
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v4
      with:
        python-version: ${{ matrix.python-version }}
    
    - name: Install Poetry
      run: |
        curl -sSL https://install.python-poetry.org | python3 -
        echo "$HOME/.local/bin" >> $GITHUB_PATH
    
    - name: Install dependencies (SQLite only)
      run: |
        poetry install --no-interaction
    
    - name: Run SQLite tests
      run: |
        poetry run python -m pytest tests/ -v

  # Тесты с PostgreSQL
  test-postgresql:
    runs-on: ubuntu-latest
    
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: testpass
          POSTGRES_USER: testuser
          POSTGRES_DB: test_db
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5434:5432
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python 3.12
      uses: actions/setup-python@v4
      with:
        python-version: "3.12"
    
    - name: Install Poetry
      run: |
        curl -sSL https://install.python-poetry.org | python3 -
        echo "$HOME/.local/bin" >> $GITHUB_PATH
    
    - name: Install PostgreSQL client (системные зависимости)
      run: |
        sudo apt-get update
        sudo apt-get install -y libpq-dev
    
    - name: Install project dependencies with PostgreSQL
      run: |
        poetry add psycopg2-binary --no-interaction
    
    - name: Run PostgreSQL tests
      env:
        TEST_POSTGRES_URL: "postgresql://testuser:testpass@localhost:5434/test_db"
      run: |
        poetry run python -m pytest tests/ -v

  # Отдельные тесты по модулям
  test-modules:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        module: [gia11, gia9, state, api]
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python 3.12
      uses: actions/setup-python@v4
      with:
        python-version: "3.12"
    
    - name: Install Poetry
      run: |
        curl -sSL https://install.python-poetry.org | python3 -
        echo "$HOME/.local/bin" >> $GITHUB_PATH
    
    - name: Install dependencies
      run: |
        poetry install --no-interaction
    
    - name: Test module ${{ matrix.module }}
      run: |
        poetry run python -m pytest tests/test_${{ matrix.module }}.py -v --tb=short

  # Проверка покрытия кода
  test-coverage:
    runs-on: ubuntu-latest
    needs: [test-sqlite, test-postgresql]
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python 3.12
      uses: actions/setup-python@v4
      with:
        python-version: "3.12"
    
    - name: Install Poetry
      run: |
        curl -sSL https://install.python-poetry.org | python3 -
        echo "$HOME/.local/bin" >> $GITHUB_PATH
    
    - name: Install dependencies
      run: |
        poetry install --no-interaction
    
    - name: Generate coverage report
      run: |
        poetry run python -m pytest tests/ \
          --cov=src.edu_stats \
          --cov-report=xml \
          --cov-report=html
    
    - name: Upload coverage reports to Codecov
      uses: codecov/codecov-action@v3
      with:
        file: ./coverage.xml
        flags: unittests
    
    - name: Upload HTML coverage report
      uses: actions/upload-artifact@v3
      with:
        name: coverage-html-report
        path: htmlcov/
        retention-days: 30